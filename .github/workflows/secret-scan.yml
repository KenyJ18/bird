name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organization アカウントの private リポジトリでは GITLEAKS_LICENSE が必要になる場合があります。
          # 個人アカウント / public リポジトリでは不要です。
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
