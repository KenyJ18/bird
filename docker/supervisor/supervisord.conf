[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info
pidfile=/var/run/supervisord.pid

; ==============================================
; Laravel Octane (Swoole): API on port 8080
; priority=10 で Nginx より先に起動し race condition を防ぐ
; ==============================================
[program:octane]
command=php /var/www/api/artisan octane:start --server=swoole --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
priority=10
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ==============================================
; Nginx: serves static frontend on port 80
; priority=20 で Octane 起動後に開始
; ==============================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
